{% extends "admin_base.html" %}
{% block title %}View All Results{% endblock %}
{% block header_title %}View All Results{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">

    <!-- Filters -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-5 py-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Class</label>
                <select id="class_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200 bg-white min-w-[140px]">
                    <option value="">All Classes</option>
                    {% for class_name in classes %}
                    <option value="{{ class_name }}">{{ class_name | title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Academic Year</label>
                <select id="year_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200 bg-white min-w-[130px]">
                    <option value="">All Years</option>
                    {% for period in all_periods %}
                    <option value="{{ period.year }}" {% if period.year == current_period.year %}selected{% endif %}>
                        {{ period.year }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Term</label>
                <select id="term_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200 bg-white min-w-[120px]">
                    <option value="">All Terms</option>
                    <option value="Term 1" {% if current_period.term == 'Term 1' %}selected{% endif %}>Term 1</option>
                    <option value="Term 2" {% if current_period.term == 'Term 2' %}selected{% endif %}>Term 2</option>
                    <option value="Term 3" {% if current_period.term == 'Term 3' %}selected{% endif %}>Term 3</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Subject</label>
                <select id="subject_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200 bg-white min-w-[150px]">
                    <option value="">All Subjects</option>
                </select>
            </div>

        </div>
    </div>

    <!-- Results Table -->
    <div id="results_section" class="hidden">
        <div class="bg-white rounded-2xl shadow overflow-hidden">
            <div class="flex flex-wrap items-center justify-between gap-3 p-5 border-b border-gray-100">
                <div>
                    <h3 class="text-base font-semibold text-gray-800" id="results_title">Results</h3>
                    <p class="text-sm text-gray-400 mt-0.5" id="summary"></p>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Class PDF -->
                    <form method="POST" action="{{ url_for('admin.results_pdf') }}" id="pdf_form" class="inline">
                        <input type="hidden" name="class_name" id="pdf_class_name">
                        <input type="hidden" name="term" id="pdf_term">
                        <input type="hidden" name="academic_year" id="pdf_academic_year">
                        <input type="hidden" name="subject_filter" id="pdf_subject_filter">
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white rounded-lg hover:opacity-90 transition" style="background-color:#1F7A5C;">
                            Class PDF
                        </button>
                    </form>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm" id="results_table">
                    <thead class="bg-gray-50" id="results_thead"></thead>
                    <tbody class="divide-y divide-gray-100" id="results_tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="loading" class="hidden text-center py-8 text-gray-400">Loading results...</div>
    <div id="no_results" class="hidden bg-white rounded-2xl shadow p-8 text-center text-gray-400">
        No results found for the selected filters.
    </div>
</div>

<script>
    const classSelect   = document.getElementById('class_select');
    const yearSelect    = document.getElementById('year_select');
    const termSelect    = document.getElementById('term_select');
    const subjectSelect = document.getElementById('subject_select');

    function loadResults() {
        const className     = classSelect.value;
        const year          = yearSelect.value;
        const term          = termSelect.value;
        const subjectFilter = subjectSelect.value;

        if (!className || !year || !term) return;

        document.getElementById('results_section').classList.add('hidden');
        document.getElementById('no_results').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        const formData = new FormData();
        formData.append('class_name', className);
        formData.append('academic_year', year);
        formData.append('term', term);
        formData.append('subject_filter', subjectFilter);

        fetch("{{ url_for('admin.get_admin_class_results') }}", { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');

                if (data.length === 0) {
                    document.getElementById('no_results').classList.remove('hidden');
                    return;
                }

                const subjects = [...new Set(data.flatMap(s => s.subjects.map(r => r.subject)))].sort();

                // Update subject filter
                subjectSelect.innerHTML = '<option value="">All Subjects</option>';
                subjects.forEach(subject => {
                    const opt = document.createElement('option');
                    opt.value = subject;
                    opt.textContent = subject;
                    if (subject === subjectFilter) opt.selected = true;
                    subjectSelect.appendChild(opt);
                });

                const totalStudents = data.length > 0 ? (data[0].total_students || data.length) : 0;

                // Header
                const thead = document.getElementById('results_thead');
                thead.innerHTML = '<tr class="text-xs font-semibold text-gray-500 uppercase tracking-wide">' +
                    '<th class="px-3 py-3 text-center w-10">Pos</th>' +
                    '<th class="px-4 py-3 text-left">Student</th>' +
                    '<th class="px-4 py-3 text-left">Number</th>' +
                    subjects.map(s => `<th class="px-3 py-3 text-center">${s}</th>`).join('') +
                    '<th class="px-3 py-3 text-center">Average</th>' +
                    '<th class="px-3 py-3 text-center">Status</th>' +
                    '<th class="px-3 py-3 text-center">Report</th>' +
                    '</tr>';

                // Body
                const tbody = document.getElementById('results_tbody');
                tbody.innerHTML = data.map(student => {
                    const subjectScores = subjects.map(subject => {
                        const result = student.subjects.find(r => r.subject === subject);
                        const score  = result ? result.score : null;
                        if (score === null) return `<td class="px-3 py-3 text-center text-gray-300">—</td>`;
                        const color  = score >= 40 ? 'text-gray-800' : 'text-red-500 font-semibold';
                        return `<td class="px-3 py-3 text-center text-sm ${color}">${score}</td>`;
                    });

                    const posCell = student.position
                        ? `<td class="px-3 py-3 text-center"><span class="inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold text-white" style="background-color:#1F7A5C">${student.position}</span></td>`
                        : `<td class="px-3 py-3 text-center text-gray-300">—</td>`;

                    const avgColor = student.average >= 40 ? 'text-emerald-600' : 'text-red-500';
                    const statusBadge = student.passed
                        ? '<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-green-100 text-green-700">Passed</span>'
                        : (student.passed === false
                            ? '<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-red-100 text-red-700">Failed</span>'
                            : '<span class="px-2 py-0.5 text-xs rounded-full bg-gray-100 text-gray-500">Incomplete</span>');

                    const reportLink = `<a href="/admin/student_report_card/${student.student_id}?term=${encodeURIComponent(term)}&year=${encodeURIComponent(year)}" target="_blank" class="text-xs px-2 py-1 rounded-md font-medium transition hover:opacity-80" style="background-color:#E8F5F0;color:#1F7A5C;">PDF</a>`;

                    return '<tr class="hover:bg-gray-50">' +
                        posCell +
                        `<td class="px-4 py-3 text-sm font-medium" style="color:#1E293B">${student.name}</td>` +
                        `<td class="px-4 py-3 text-sm text-gray-500">${student.student_number}</td>` +
                        subjectScores.join('') +
                        `<td class="px-3 py-3 text-center text-sm font-semibold ${avgColor}">${student.average !== null ? student.average + '%' : '—'}</td>` +
                        `<td class="px-3 py-3 text-center">${statusBadge}</td>` +
                        `<td class="px-3 py-3 text-center">${reportLink}</td>` +
                        '</tr>';
                }).join('');

                // Summary
                const rankedCount  = data.filter(s => s.position !== null).length;
                const passedCount  = data.filter(s => s.passed).length;
                document.getElementById('summary').textContent =
                    `${totalStudents} students • ${rankedCount} ranked • ${passedCount} passed`;
                document.getElementById('results_title').textContent =
                    `Results — ${className.charAt(0).toUpperCase()+className.slice(1)}, ${term} ${year}`;

                // PDF form values
                document.getElementById('pdf_class_name').value    = className;
                document.getElementById('pdf_term').value          = term;
                document.getElementById('pdf_academic_year').value = year;
                document.getElementById('pdf_subject_filter').value = subjectFilter;

                document.getElementById('results_section').classList.remove('hidden');
            })
            .catch(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('no_results').classList.remove('hidden');
            });
    }

    classSelect.addEventListener('change', loadResults);
    yearSelect.addEventListener('change', loadResults);
    termSelect.addEventListener('change', loadResults);
    subjectSelect.addEventListener('change', loadResults);

    if (classSelect.value && yearSelect.value && termSelect.value) loadResults();
</script>
{% endblock %}
