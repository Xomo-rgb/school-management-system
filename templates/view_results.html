{% extends "teacher_base.html" %}
{% block title %}View Results{% endblock %}
{% block header_title %}View Results{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">

    <!-- Filter bar -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-5 py-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Class</label>
                <select id="class_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-200 bg-white min-w-[160px]">
                    <option value="">All Classes</option>
                    {% for assignment in assignments %}
                    <option value="{{ assignment.class_name }}">{{ assignment.class_name | title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Academic Year</label>
                <select id="year_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-200 bg-white min-w-[130px]">
                    <option value="">All Years</option>
                    {% for period in all_periods %}
                    <option value="{{ period.year }}" {% if period.year == current_period.year %}selected{% endif %}>
                        {{ period.year }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Term</label>
                <select id="term_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-200 bg-white min-w-[120px]">
                    <option value="">All Terms</option>
                    <option value="Term 1" {% if current_period.term == 'Term 1' %}selected{% endif %}>Term 1</option>
                    <option value="Term 2" {% if current_period.term == 'Term 2' %}selected{% endif %}>Term 2</option>
                    <option value="Term 3" {% if current_period.term == 'Term 3' %}selected{% endif %}>Term 3</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Subject</label>
                <select id="subject_select" class="text-sm rounded-lg border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-200 bg-white min-w-[150px]">
                    <option value="">All Subjects</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Loading / Empty states -->
    <div id="loading" class="hidden text-center py-12 text-gray-400 text-sm">Loading results…</div>
    <div id="no_results" class="hidden bg-white rounded-xl border border-gray-100 shadow-sm p-12 text-center">
        <svg class="w-10 h-10 mx-auto mb-3 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <p class="text-sm text-gray-400">No results found for the selected filters.</p>
    </div>

    <!-- Results section -->
    <div id="results_section" class="hidden">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">

            <!-- Card header -->
            <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-b border-gray-100">
                <div>
                    <h3 class="text-sm font-semibold text-gray-800" id="results_title">Results</h3>
                    <div id="summary" class="flex flex-wrap gap-2 mt-1.5"></div>
                </div>
                <div class="flex items-center gap-2">
                    <form method="POST" action="{{ url_for('teacher.view_results_pdf') }}" id="teacher_pdf_form" class="inline">
                        <input type="hidden" name="class_name"     id="teacher_pdf_class_name">
                        <input type="hidden" name="term"           id="teacher_pdf_term">
                        <input type="hidden" name="academic_year"  id="teacher_pdf_academic_year">
                        <input type="hidden" name="subject_filter" id="teacher_pdf_subject_filter">
                        <button type="submit"
                                class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium text-white rounded-lg transition hover:opacity-90"
                                style="background-color: #1F7A5C;">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            PDF
                        </button>
                    </form>
                    <form method="POST" action="{{ url_for('teacher.view_results_csv') }}" id="teacher_csv_form" class="inline">
                        <input type="hidden" name="class_name"     id="teacher_csv_class_name">
                        <input type="hidden" name="term"           id="teacher_csv_term">
                        <input type="hidden" name="academic_year"  id="teacher_csv_academic_year">
                        <input type="hidden" name="subject_filter" id="teacher_csv_subject_filter">
                        <button type="submit"
                                class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            CSV
                        </button>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm" id="results_table">
                    <thead id="results_thead" style="background-color: #F8FAFB;"></thead>
                    <tbody id="results_tbody" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    const classSelect   = document.getElementById('class_select');
    const yearSelect    = document.getElementById('year_select');
    const termSelect    = document.getElementById('term_select');
    const subjectSelect = document.getElementById('subject_select');
    const classSubjectMap = {{ assignments | tojson }};

    function updateSubjectOptions() {
        const assignment = classSubjectMap.find(a => a.class_name === classSelect.value) || {};
        const subjects   = assignment.subjects || [];
        subjectSelect.innerHTML = '<option value="">All Subjects</option>';
        subjects.forEach(s => {
            const o = document.createElement('option');
            o.value = o.textContent = s;
            subjectSelect.appendChild(o);
        });
    }

    function loadResults() {
        const className     = classSelect.value;
        const year          = yearSelect.value;
        const term          = termSelect.value;
        const subjectFilter = subjectSelect.value;

        if (!className || !year || !term) return;

        document.getElementById('results_section').classList.add('hidden');
        document.getElementById('no_results').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        const fd = new FormData();
        fd.append('class_name',     className);
        fd.append('academic_year',  year);
        fd.append('term',           term);
        fd.append('subject_filter', subjectFilter);

        fetch("{{ url_for('teacher.get_class_results') }}", { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');

                if (!data.length) {
                    document.getElementById('no_results').classList.remove('hidden');
                    return;
                }

                // Sort by average desc to assign positions
                const ranked = [...data].filter(s => s.average !== null)
                                        .sort((a, b) => b.average - a.average);
                const posMap = {};
                ranked.forEach((s, i) => posMap[s.student_id || s.name] = i + 1);

                const subjects = [...new Set(data.flatMap(s => s.subjects.map(r => r.subject)))].sort();

                // Header
                document.getElementById('results_thead').innerHTML =
                    '<tr class="text-xs font-semibold text-gray-400 uppercase tracking-wide">'
                    + '<th class="px-3 py-3 text-center w-10">Pos</th>'
                    + '<th class="px-4 py-3 text-left">Student</th>'
                    + subjects.map(s => `<th class="px-3 py-3 text-center">${s}</th>`).join('')
                    + '<th class="px-3 py-3 text-center">Average</th>'
                    + '<th class="px-3 py-3 text-center">Status</th>'
                    + '</tr>';

                // Rows
                document.getElementById('results_tbody').innerHTML = data.map(student => {
                    const scoreMap = {};
                    student.subjects.forEach(r => scoreMap[r.subject] = r.score);

                    const pos = posMap[student.student_id || student.name];
                    const posCell = pos
                        ? `<td class="px-3 py-3 text-center"><span class="inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold text-white" style="background-color:#0891b2">${pos}</span></td>`
                        : `<td class="px-3 py-3 text-center text-gray-300">—</td>`;

                    const subjectCells = subjects.map(s => {
                        const score = scoreMap[s];
                        if (score === undefined) return `<td class="px-3 py-3 text-center text-gray-200">—</td>`;
                        const color = score < 40 ? 'text-red-500 font-semibold' : 'text-gray-700';
                        return `<td class="px-3 py-3 text-center text-sm ${color}">${score}</td>`;
                    }).join('');

                    const avgColor = student.average === null ? 'text-gray-300'
                        : student.passed ? 'text-emerald-600' : 'text-red-500';
                    const avgCell = `<td class="px-3 py-3 text-center font-semibold text-sm ${avgColor}">${student.average !== null ? student.average + '%' : '—'}</td>`;

                    const statusCell = student.passed === null
                        ? `<td class="px-3 py-3 text-center"><span class="px-2 py-0.5 bg-gray-100 text-gray-400 text-xs rounded-full">No Data</span></td>`
                        : student.passed
                        ? `<td class="px-3 py-3 text-center"><span class="px-2 py-0.5 bg-green-100 text-green-700 text-xs font-semibold rounded-full">Passed</span></td>`
                        : `<td class="px-3 py-3 text-center"><span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-semibold rounded-full">Failed</span></td>`;

                    return `<tr class="hover:bg-gray-50 transition">
                        ${posCell}
                        <td class="px-4 py-3">
                            <p class="text-sm font-medium" style="color:#1E293B">${student.name}</p>
                            <p class="text-xs text-gray-400">${student.student_number}</p>
                        </td>
                        ${subjectCells}${avgCell}${statusCell}
                    </tr>`;
                }).join('');

                // Summary badges
                const passed  = data.filter(s => s.passed === true).length;
                const failed  = data.filter(s => s.passed === false).length;
                const noData  = data.filter(s => s.passed === null).length;
                document.getElementById('summary').innerHTML = [
                    `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">${data.length} students</span>`,
                    `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">${passed} passed</span>`,
                    failed  ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-600">${failed} failed</span>` : '',
                    noData  ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-400">${noData} no data</span>` : '',
                ].join('');

                document.getElementById('results_title').textContent =
                    className.charAt(0).toUpperCase() + className.slice(1) + ' — ' + term + ' ' + year;

                // PDF / CSV hidden inputs
                ['pdf', 'csv'].forEach(type => {
                    document.getElementById(`teacher_${type}_class_name`).value    = className;
                    document.getElementById(`teacher_${type}_term`).value          = term;
                    document.getElementById(`teacher_${type}_academic_year`).value = year;
                    document.getElementById(`teacher_${type}_subject_filter`).value = subjectFilter;
                });

                document.getElementById('results_section').classList.remove('hidden');
            });
    }

    classSelect.addEventListener('change',   () => { updateSubjectOptions(); loadResults(); });
    yearSelect.addEventListener('change',    loadResults);
    termSelect.addEventListener('change',    loadResults);
    subjectSelect.addEventListener('change', loadResults);

    updateSubjectOptions();
</script>
{% endblock %}
