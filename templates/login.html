<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony School — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /*
         * BACKGROUND OPTIONS — uncomment one:
         *
         * A) Background image (current)
         * B) Solid dark green gradient (no image needed)
         *
         * To go image-free, swap the two blocks below.
         */

        /* A) Image background */
        .login-bg {
            background-image: url("{{ url_for('static', filename='images/loginoption2.jpg') }}");
            /* Other options:
            background-image: url("{{ url_for('static', filename='images/loginoption3.webp') }}");
            background-image: url("{{ url_for('static', filename='images/loginoption4.jpg') }}");
            background-image: url("{{ url_for('static', filename='images/loginoption5.webp') }}");
            background-image: url("{{ url_for('static', filename='images/login-bg.jpg') }}");
            */
            background-size: cover;
            background-position: center;
        }

        /* B) No image — uncomment this and remove .login-bg above
        .login-bg {
            background: linear-gradient(135deg, #0f2d22 0%, #1F7A5C 60%, #145c43 100%);
        }
        */
    </style>
</head>

<body class="login-bg min-h-screen flex items-center justify-center relative">

    <!-- Dark overlay (only visible when using a background image — harmless on solid bg) -->
    <div class="absolute inset-0" style="background: rgba(10, 30, 20, 0.65);"></div>

    <!-- Login card -->
    <div class="relative z-10 w-full max-w-sm mx-4">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

            <!-- Brand accent bar -->
            <div class="h-1.5 w-full" style="background-color: #1F7A5C;"></div>

            <div class="px-8 pt-8 pb-8">

                <!-- Logo + title -->
                <div class="flex flex-col items-center mb-8">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-3 shadow-md"
                         style="background-color: #1F7A5C;">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m0-6l-3.5 2M12 20l3.5-2"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight" style="color: #1E293B;">Harmony School Portal</h1>
                    <p class="text-xs text-gray-400 mt-0.5">Sign in to your account</p>
                </div>

                <!-- Flash messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    <div class="mb-5 space-y-2">
                      {% for category, message in messages %}
                        <div class="p-3 rounded-xl text-sm
                            {% if category == 'error' %}bg-red-50 text-red-700 border border-red-200
                            {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                            {{ message }}
                        </div>
                      {% endfor %}
                    </div>
                  {% endif %}
                {% endwith %}

                <!-- Form -->
                <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">

                    <!-- Email -->
                    <div>
                        <label for="email"
                               class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">
                            Email Address
                        </label>
                        <input type="email" name="email" id="email" required autocomplete="email"
                               placeholder="you@harmonyschool.edu"
                               class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-gray-800
                                      placeholder-gray-300 focus:outline-none focus:ring-2 focus:border-transparent
                                      transition"
                               style="--tw-ring-color: #b7ddd1;"
                               onfocus="this.style.borderColor='#1F7A5C'; this.style.boxShadow='0 0 0 3px rgba(31,122,92,0.15)'"
                               onblur="this.style.borderColor=''; this.style.boxShadow=''">
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password"
                               class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">
                            Password
                        </label>
                        <div class="relative">
                            <input type="password" name="password" id="password" required autocomplete="current-password"
                                   placeholder="••••••••"
                                   class="w-full rounded-xl border border-gray-200 px-4 py-2.5 pr-11 text-sm text-gray-800
                                          placeholder-gray-300 focus:outline-none transition"
                                   onfocus="this.style.borderColor='#1F7A5C'; this.style.boxShadow='0 0 0 3px rgba(31,122,92,0.15)'"
                                   onblur="this.style.borderColor=''; this.style.boxShadow=''">
                            <button type="button" onclick="togglePassword()"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 transition"
                                    tabindex="-1" aria-label="Show/hide password">
                                <svg id="eye_show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                                <svg id="eye_hide" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="pt-2">
                        <button type="submit"
                                class="w-full py-2.5 text-sm font-semibold text-white rounded-xl transition hover:opacity-90 active:scale-[0.98]"
                                style="background-color: #1F7A5C;">
                            Sign In
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-white/40 mt-5">
            &copy; {{ 2026 }} Harmony School Management System
        </p>
    </div>

    <script>
    function togglePassword() {
        const input   = document.getElementById('password');
        const eyeShow = document.getElementById('eye_show');
        const eyeHide = document.getElementById('eye_hide');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        eyeShow.classList.toggle('hidden', isHidden);
        eyeHide.classList.toggle('hidden', !isHidden);
    }
    </script>

</body>
</html>
